<!DOCTYPE html>
<html>
<head>
    <meta name="robots" content="noindex, nofollow">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Segoe UI', sans-serif; background: #f7f5f2; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
.splash { text-align: center; }
.splash h1 { font-family: Georgia, serif; font-size: 36px; color: #0f1b2d; margin-bottom: 4px; }
.splash h1 span { color: #c8a55c; }
.splash p { color: #6b6b7b; font-size: 13px; margin-bottom: 24px; }
.spinner { width: 32px; height: 32px; border: 3px solid #e0ddd8; border-top: 3px solid #c8a55c; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto; }
@keyframes spin { to { transform: rotate(360deg); } }
.status { color: #c8a55c; font-size: 12px; margin-top: 16px; }
</style>
</head>
<body>
<div class="splash">
    <h1><span>N</span>otare</h1>
    <p>Legal Transcription Platform</p>
    <div class="spinner"></div>
    <div class="status" id="status">Starting...</div>
</div>
<script>
let attempts = 0;
function checkServer() {
    attempts++;
    const msgs = ['Starting...', 'Loading modules...', 'Preparing workspace...', 'Almost ready...'];
    document.getElementById('status').textContent = msgs[Math.min(attempts - 1, msgs.length - 1)];
    fetch('/api/jobs').then(r => {
        if (r.ok) window.location = '/static/index.html';
        else setTimeout(checkServer, 1000);
    }).catch(() => setTimeout(checkServer, 1000));
}
setTimeout(checkServer, 1500);
</script>
</body>
</html>
